name: ci

on:
    push:
        branches:
            - "master"
    workflow_dispatch: {}

env:
    # Version du Salesforce CLI embarquée dans l'image (https://www.npmjs.com/package/@salesforce/cli)
    SF_CLI_VERSION: "2.150.6"
    IMAGE_NAME: sfdx-cli-gitlab

jobs:
    docker:
        runs-on: ubuntu-latest
        steps:
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_HUB_TOKEN }}
            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  push: true
                  platforms: linux/amd64
                  build-args: |
                      SF_CLI_VERSION=${{ env.SF_CLI_VERSION }}
                  tags: |
                      ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.SF_CLI_VERSION }}
                      ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
